
name: Build openWRT ipk/apk package

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
    tags:
      - '0.*.*'
    paths-ignore:
      - '**.md'
      - 'images/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'images/**'

jobs:
  build_package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - format: 'ipk'
            sdk_version: '24.10.1'
            sdk_url_path: 'releases/24.10.1'
            sdk_file_prefix: 'openwrt-sdk-24.10.1'
          - format: 'apk'
            sdk_version: '25.12.5'
            sdk_url_path: 'releases/25.12.5'
            sdk_file_prefix: 'openwrt-sdk-25.12.5'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.format }}-${{ matrix.sdk_version }}

    steps:
    - name: Cache apt packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget curl
        version: 1.0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget curl

    - name: Cache OpenWrt SDK
      uses: actions/cache@v4
      id: cache-sdk
      with:
        path: openwrt-sdk-*
        key: openwrt-sdk-${{ matrix.sdk_version }}-${{ hashFiles('.github/workflows/build_new_package.yml') }}
        restore-keys: |
          openwrt-sdk-${{ matrix.sdk_version }}-

    - name: Download OpenWrt release SDK
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        # 找到 SDK 名称 #
        PAGE_CONTENT=$(curl -s https://downloads.openwrt.org/${{ matrix.sdk_url_path }}/targets/x86/64/)
        SDK_FILENAME=$(echo "$PAGE_CONTENT" | grep -oP '${{ matrix.sdk_file_prefix }}-x86-64_gcc-.*?_musl\.Linux-x86_64\.tar\.zst' | head -1)
        if [ -z "$SDK_FILENAME" ]; then
          echo "未找到 SDK 文件"
          exit 1
        fi
        # 构建完整 URL
        sdk_name=${SDK_FILENAME%.tar.zst}
        wget -c https://downloads.openwrt.org/${{ matrix.sdk_url_path }}/targets/x86/64/${SDK_FILENAME}
        tar axf $SDK_FILENAME
        ln -sf $sdk_name openwrt_sdk

    - name: Verify SDK directory
      run: |
        # Find the actual SDK directory
        SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -1)
        if [ -z "$SDK_DIR" ]; then
          echo "Error: No openwrt-sdk-* directory found"
          ls -la
          exit 1
        fi
        # Create symlink if it doesn't exist
        if [ ! -L "openwrt_sdk" ]; then
          ln -sf "$(basename $SDK_DIR)" openwrt_sdk
        fi
        echo "SDK directory verified: $(readlink -f openwrt_sdk)"

    - name: Cache feeds
      uses: actions/cache@v4
      with:
        path: |
          openwrt_sdk/feeds
          openwrt_sdk/staging_dir/host
        key: openwrt-feeds-${{ matrix.sdk_version }}-${{ hashFiles('openwrt_sdk/feeds.conf.default') }}
        restore-keys: |
          openwrt-feeds-${{ matrix.sdk_version }}-
      continue-on-error: true

    - name: Set up OpenWrt SDK
      run: |
        cd openwrt_sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
        path: openwrt_sdk/package/luci-app-openproxy
        fetch-depth: 1
    
    - name: Determine Version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "PKG_VERSION=$VERSION" >> $GITHUB_ENV
          echo "PKG_RELEASE=1" >> $GITHUB_ENV
        else
          # Beta / Snapshot
          DATE=$(date +'%Y.%m.%d')
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          # IPK allows hyphens; APK requires _suffix format (no bare hyphens)
          echo "PKG_VERSION_IPK=$DATE-beta-$SHA" >> $GITHUB_ENV
          echo "PKG_VERSION_APK=${DATE}_git${SHA}" >> $GITHUB_ENV
          echo "PKG_RELEASE=1" >> $GITHUB_ENV
        fi
    
    - name: Generate ChangeLog by conventional-changelog
      run: |
        npm install -g conventional-changelog-cli
        cd openwrt_sdk/package/luci-app-openproxy
        conventional-changelog -p angular -r 2 -i CHANGELOG.md -s

    - name: Upload ChangeLog
      if: matrix.format == 'ipk'
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-openproxy-changelog
        path: openwrt_sdk/package/luci-app-openproxy/CHANGELOG.md

    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          openwrt_sdk/build_dir
          openwrt_sdk/staging_dir
        key: build-cache-${{ matrix.format }}-${{ github.sha }}
        restore-keys: |
          build-cache-${{ matrix.format }}-

    - name: Build ${{ matrix.format }} package
      run: |
        cd openwrt_sdk
        # Bypass hash checks due to Ubuntu 24.04 zstd/git tarball determinism issues
        find package/ feeds/ -type f -name Makefile -exec sed -i 's/^PKG_HASH:=.*/PKG_HASH:=skip/g' {} + || true
        find package/ feeds/ -type f -name Makefile -exec sed -i 's/^PKG_MIRROR_HASH:=.*/PKG_MIRROR_HASH:=skip/g' {} + || true
        
        # Select the right version for the package format
        # For tags: PKG_VERSION is set; for betas: PKG_VERSION_IPK/APK are set
        if [ "${{ matrix.format }}" = "apk" ]; then
          BUILD_VER="${PKG_VERSION_APK:-$PKG_VERSION}"
        else
          BUILD_VER="${PKG_VERSION_IPK:-$PKG_VERSION}"
        fi
        
        make defconfig
        if [ "${{ matrix.format }}" = "apk" ]; then
          echo "CONFIG_USE_APK=y" >> .config
          make defconfig
        fi
        make package/luci-app-openproxy/prepare
        # IGNORE_ERRORS=m: continue past dependency package failures (e.g. libnl-tiny APK version issues)
        # Our package is PKGARCH:=all with empty Build/Compile, so it doesn't need deps compiled
        make package/luci-app-openproxy/compile V=s IGNORE_ERRORS=m -j$(($(nproc) + 1)) BUILD_VERSION="$BUILD_VER" BUILD_RELEASE="${{ env.PKG_RELEASE }}" || \
        make package/luci-app-openproxy/compile V=s IGNORE_ERRORS=m -j1 BUILD_VERSION="$BUILD_VER" BUILD_RELEASE="${{ env.PKG_RELEASE }}"

    - name: Generate build summary
      if: always()
      run: |
        echo "### Build Summary (${{ matrix.format }})" >> $GITHUB_STEP_SUMMARY
        echo "- SDK Version: ${{ matrix.sdk_version }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- Packages:" >> $GITHUB_STEP_SUMMARY
        find openwrt_sdk/bin/packages/ -name "luci-app-openproxy*.${{ matrix.format }}" -exec ls -lh {} + >> $GITHUB_STEP_SUMMARY || true

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-openproxy-${{ matrix.format }}
        path: openwrt_sdk/bin/packages/**/luci-app-openproxy*.${{ matrix.format }}

  beta_release:
    runs-on: ubuntu-latest
    needs: [build_package]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
    
    - name: Display structure of downloaded files
      run: ls -R
    
    - name: Get short SHA
      id: short_sha
      run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
    
    - name: Create Beta Pre-release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: beta-${{ steps.short_sha.outputs.sha_short }}
        name: Beta Release (${{ steps.short_sha.outputs.sha_short }})
        prerelease: true
        files: |
          luci-app-openproxy-ipk/*.ipk
          luci-app-openproxy-apk/*.apk
        body: |
          ## Beta Release
          
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          **Build Date:** ${{ github.event.head_commit.timestamp }}
          
          This is an automated beta pre-release built from the latest commit to `${{ github.ref_name }}`.
          
          ### Changes
          ${{ github.event.head_commit.message }}
          
          ---
          
          **⚠️ Warning:** This is a pre-release version and may contain bugs. Use at your own risk.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: [build_package]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
    - name: Display structure of downloaded files
      run: ls -R
    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        files: |
          luci-app-openproxy-ipk/*.ipk
          luci-app-openproxy-apk/*.apk
        body_path: luci-app-openproxy-changelog/CHANGELOG.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
