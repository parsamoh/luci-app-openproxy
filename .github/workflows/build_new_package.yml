name: Build openWRT ipk/apk package

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
    tags:
      - '0.*.*'
    paths-ignore:
      - '**.md'
      - 'images/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'images/**'

jobs:
  prepare:
    name: Prepare Release Data
    runs-on: ubuntu-latest
    outputs:
      PKG_VERSION: ${{ steps.version.outputs.PKG_VERSION }}
      PKG_RELEASE: ${{ steps.version.outputs.PKG_RELEASE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
            echo "PKG_VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "PKG_RELEASE=1" >> $GITHUB_OUTPUT
          else
            # Beta / Snapshot
            DATE=$(date +'%Y.%m.%d')
            echo "PKG_VERSION=${DATE}" >> $GITHUB_OUTPUT
            echo "PKG_RELEASE=1" >> $GITHUB_OUTPUT
          fi
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate ChangeLog
        run: |
          npx conventional-changelog-cli -p angular -r 2 -i CHANGELOG.md -s

      - name: Upload ChangeLog
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-openproxy-changelog
          path: CHANGELOG.md

  build_ipk:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk_version: ['24.10.1']
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ipk-${{ matrix.sdk_version }}

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git wget curl unzip file

    - name: Cache OpenWrt SDK
      uses: actions/cache@v4
      id: cache-sdk
      with:
        path: openwrt-sdk-*
        key: openwrt-sdk-${{ matrix.sdk_version }}-${{ hashFiles('.github/workflows/build_new_package.yml') }}
        restore-keys: |
          openwrt-sdk-${{ matrix.sdk_version }}-

    - name: Download OpenWrt release SDK
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        wget -qO sha256sums https://downloads.openwrt.org/releases/${{ matrix.sdk_version }}/targets/x86/64/sha256sums
        SDK_FILENAME=$(grep 'openwrt-sdk' sha256sums | grep '\.tar\.zst' | awk '{print $2}' | head -n 1)
        if [ -z "$SDK_FILENAME" ]; then
          echo "Error: SDK file not found in sha256sums"
          exit 1
        fi
        SDK_FILENAME=$(basename "$SDK_FILENAME" | sed 's/^\*//')
        sdk_name=${SDK_FILENAME%.tar.zst}
        
        wget -c https://downloads.openwrt.org/releases/${{ matrix.sdk_version }}/targets/x86/64/${SDK_FILENAME}
        tar axf $SDK_FILENAME

    - name: Verify SDK directory
      run: |
        SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -1)
        if [ -z "$SDK_DIR" ]; then
          echo "Error: No openwrt-sdk-* directory found"
          ls -la
          exit 1
        fi
        if [ ! -L "openwrt_sdk" ]; then
          ln -sf "$(basename $SDK_DIR)" openwrt_sdk
        fi
        echo "SDK directory verified: $(readlink -f openwrt_sdk)"

    - name: Cache feeds
      uses: actions/cache@v4
      with:
        path: |
          openwrt_sdk/feeds
          openwrt_sdk/staging_dir/host
        key: openwrt-feeds-${{ matrix.sdk_version }}-${{ hashFiles('openwrt_sdk/feeds.conf.default') }}
        restore-keys: |
          openwrt-feeds-${{ matrix.sdk_version }}-
      continue-on-error: true

    - name: Set up OpenWrt SDK
      run: |
        cd openwrt_sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
        path: openwrt_sdk/package/luci-app-openproxy
        fetch-depth: 1
    
    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          openwrt_sdk/build_dir
          openwrt_sdk/staging_dir
        key: build-cache-ipk-${{ github.sha }}
        restore-keys: |
          build-cache-ipk-

    - name: Build IPK package
      run: |
        cd openwrt_sdk
        make defconfig
        make package/luci-app-openproxy/prepare
        make package/luci-app-openproxy/compile V=s -j$(($(nproc) + 1)) BUILD_VERSION="${{ needs.prepare.outputs.PKG_VERSION }}" BUILD_RELEASE="${{ needs.prepare.outputs.PKG_RELEASE }}"

    - name: Generate build summary
      if: always()
      run: |
        echo "### Build Summary (IPK)" >> $GITHUB_STEP_SUMMARY
        echo "- SDK Version: ${{ matrix.sdk_version }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- Packages:" >> $GITHUB_STEP_SUMMARY
        find openwrt_sdk/bin/packages/ -name "luci-app-openproxy*.ipk" -exec ls -lh {} \; >> $GITHUB_STEP_SUMMARY || true

    - name: Upload .ipk package
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-openproxy-ipk
        path: openwrt_sdk/bin/packages/**/luci-app-openproxy*.ipk

  build_apk:
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-apk

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
        fetch-depth: 1

    - name: Build APK package via Docker SDK
      run: |
        CONTAINER_ID=$(docker create openwrt/sdk:x86-64-25.12.2 sleep 3600)
        docker start $CONTAINER_ID

        docker exec -u root $CONTAINER_ID mkdir -p /builder/package
        docker cp . $CONTAINER_ID:/builder/package/luci-app-openproxy
        docker exec -u root $CONTAINER_ID chmod -R 777 /builder/package/luci-app-openproxy

        docker exec -u root $CONTAINER_ID mkdir -p /tmp/artifacts
        docker exec -u root $CONTAINER_ID chmod 777 /tmp/artifacts

        docker exec $CONTAINER_ID bash -c "
          cd /builder && \
          [ -x ./scripts/feeds ] && ./scripts/feeds update -a || true && \
          [ -x ./scripts/feeds ] && ./scripts/feeds install -a || true && \
          rm -f .config && \
          touch .config && \
          echo '# CONFIG_ALL is not set' >> .config && \
          echo '# CONFIG_ALL_KMODS is not set' >> .config && \
          echo '# CONFIG_ALL_NONSHARED is not set' >> .config && \
          echo 'CONFIG_PACKAGE_luci-app-openproxy=m' >> .config && \
          (make defconfig || true) && \
          make package/luci-app-openproxy/compile V=s BUILD_VERSION=\"${{ needs.prepare.outputs.PKG_VERSION }}\" BUILD_RELEASE=\"${{ needs.prepare.outputs.PKG_RELEASE }}\" && \
          find bin/packages/ -name 'luci-app-openproxy*.apk' -exec cp {} /tmp/artifacts/ \;
        "

        mkdir -p ./artifacts
        docker cp $CONTAINER_ID:/tmp/artifacts/. ./artifacts/
        docker rm -f $CONTAINER_ID

    - name: Generate build summary
      if: always()
      run: |
        echo "### Build Summary (APK)" >> $GITHUB_STEP_SUMMARY
        echo "- SDK: openwrt/sdk:x86-64-25.12.2" >> $GITHUB_STEP_SUMMARY
        echo "- Build Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- Packages:" >> $GITHUB_STEP_SUMMARY
        ls -lh ./artifacts/ >> $GITHUB_STEP_SUMMARY || true

    - name: Upload .apk package
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-openproxy-apk
        path: ./artifacts/luci-app-openproxy*.apk

  beta_release:
    runs-on: ubuntu-latest
    needs: [build_ipk, build_apk]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
    
    - name: Display structure of downloaded files
      run: ls -R
    
    - name: Get short SHA
      id: short_sha
      run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
    
    - name: Create Beta Pre-release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: beta-${{ steps.short_sha.outputs.sha_short }}
        name: Beta Release (${{ steps.short_sha.outputs.sha_short }})
        prerelease: true
        files: |
          luci-app-openproxy-ipk/*.ipk
          luci-app-openproxy-apk/*.apk
        body: |
          ## Beta Release
          
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          **Build Date:** ${{ github.event.head_commit.timestamp }}
          
          This is an automated beta pre-release built from the latest commit to `${{ github.ref_name }}`.
          
          ### Changes
          ${{ github.event.head_commit.message }}
          
          ---
          
          **⚠️ Warning:** This is a pre-release version and may contain bugs. Use at your own risk.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: [build_ipk, build_apk]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
    - name: Display structure of downloaded files
      run: ls -R
    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        files: |
          luci-app-openproxy-ipk/*.ipk
          luci-app-openproxy-apk/*.apk
        body_path: luci-app-openproxy-changelog/CHANGELOG.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
