name: Build openWRT ipk/apk package

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
    tags:
      - '0.*.*'
    paths-ignore:
      - '**.md'
      - 'images/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'images/**'

jobs:
  prepare:
    name: Prepare Release Data
    runs-on: ubuntu-latest
    outputs:
      PKG_VERSION: ${{ steps.version.outputs.PKG_VERSION }}
      PKG_RELEASE: ${{ steps.version.outputs.PKG_RELEASE }}
      SHORT_SHA: ${{ steps.version.outputs.SHORT_SHA }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
            echo "PKG_VERSION=$VERSION" >> $GITHUB_OUTPUT
          else
            # Beta / Snapshot
            DATE=$(date +'%Y.%m.%d')
            echo "PKG_VERSION=${DATE}" >> $GITHUB_OUTPUT
          fi
          echo "PKG_RELEASE=1" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate ChangeLog
        run: |
          npx conventional-changelog-cli -p angular -r 2 -i CHANGELOG.md -s

      - name: Upload ChangeLog
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-openproxy-changelog
          path: CHANGELOG.md

  build:
    needs: prepare
    name: ${{ matrix.arch }}-${{ matrix.branch }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
        branch:
          - openwrt-24.10
          - openwrt-25.12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject Version
        run: |
          perl -0777 -pi -e 's/ifdef BUILD_VERSION.*?endif/PKG_VERSION:=${{ needs.prepare.outputs.PKG_VERSION }}/s' Makefile
          perl -0777 -pi -e 's/ifdef BUILD_RELEASE.*?endif/PKG_RELEASE:=${{ needs.prepare.outputs.PKG_RELEASE }}/s' Makefile

      - name: Build Packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: luci-app-openproxy
          PACKAGES: luci-app-openproxy
          NO_REFRESH_CHECK: true

      - name: Extract artifacts
        run: |
          mkdir -p ./artifacts
          find bin/packages/ -name "luci-app-openproxy*.ipk" -exec cp {} ./artifacts/ \; || true
          find bin/packages/ -name "luci-app-openproxy*.apk" -exec cp {} ./artifacts/ \; || true

      - name: Generate build summary
        if: always()
        run: |
          echo "### Build Summary (${{ matrix.branch }})" >> $GITHUB_STEP_SUMMARY
          echo "- Target: ${{ matrix.arch }}-${{ matrix.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Packages:" >> $GITHUB_STEP_SUMMARY
          ls -lh ./artifacts/ >> $GITHUB_STEP_SUMMARY || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-openproxy-${{ matrix.arch }}-${{ matrix.branch }}
          path: ./artifacts/*

  beta_release:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Beta Pre-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: beta-${{ needs.prepare.outputs.SHORT_SHA }}
          name: Beta Release (${{ needs.prepare.outputs.SHORT_SHA }})
          prerelease: true
          files: |
            luci-app-openproxy-*/luci-app-openproxy*.*pk
          body: |
            ## Beta Release
            
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            
            This is an automated beta pre-release built from the latest commit to `${{ github.ref_name }}`.
            
            ### Changes
            ${{ github.event.head_commit.message }}
            
            ---
            
            **⚠️ Warning:** This is a pre-release version and may contain bugs. Use at your own risk.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            luci-app-openproxy-*/luci-app-openproxy*.*pk
          body_path: luci-app-openproxy-changelog/CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
