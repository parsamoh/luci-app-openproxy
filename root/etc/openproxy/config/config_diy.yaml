port: 7889
socks-port: 1080 # SOCKS5 proxy port, DNS requests will be forwarded
redir-port: 3333 # Transparent proxy port
tproxy-port: 3330 # Transparent proxy port used by TPROXY, supports TCP and UDP
mode: rule
allow-lan: true
routing-mark: 0xff # Used by TPROXY, marking processed packets
bind-address: '*'
# Do not use IPv6 address (cooperate with bind-address above)
ipv6: false
external-controller: 192.168.50.1:9090
external-ui: /etc/openproxy/ui
secret: ""

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  listen: :1053
  nameserver:
    - 114.114.114.114
    - 223.5.5.5
    - https://doh.pub/dns-query
  fallback:
    - https://dns.cloudflare.com/dns-query
    - tls://dns.google:853
    - https://1.1.1.1/dns-query
  fake-ip-filter:
    - +.*
profile:
  store-selected: true
# Sniffing domain (used for domain rule matching: if not enabled, can only match by IP rules)
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  force-domain:
    - +
  skip-domain:
    - +.apple.com
    - Mijia Cloud
    - dlg.io.mi.com
    - +.oray.com
    - +.sunlogin.net
    - +.push.apple.com
  # skip-src-address:
  #   - 192.168.0.3/32
  skip-dst-address:
    - 192.168.0.0/16
# Reserved proxy node list (startup configuration file does not contain any node information, node information is provided by proxy-provider)
proxies: []
proxy-providers:
  proxy-provider-http001:
    type: http
    path: ./providers/provider_http_001.yaml
    url: https://raw.githubusercontent.com/vxiaov/free_proxies/main/clash/clash.provider.yaml
    interval: 3600
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
  proxy-provider-http002:
    type: http
    udp: false
    path: ./providers/provider_http_002.yaml
    url: https://raw.githubusercontent.com/vxiaov/free_proxies/main/clash/clash.provider.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://cp.cloudflare.com
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204
  proxy-provider-diy:
    type: file
    path: ./providers/provider_diy.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
  - name: 🎲Auto Subscription Group
    type: url-test
    proxies:
    use:
      - proxy-provider-http002
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 150
  - name: 🚀Subscription Group 01
    type: select
    use:
      - proxy-provider-http001
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 150
  - name: 🚀Subscription Group 02
    type: select
    use:
      - proxy-provider-http002
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 150
  - name: 👤Personal Node Group
    type: select
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 150
    use:
      - proxy-provider-diy
  - name: 🌐Select Group
    type: select
    proxies:
      - 🎲Auto Subscription Group
      - 🚀Subscription Group 01
      - 🚀Subscription Group 02
      - 👤Personal Node Group
      - DIRECT
  - name: 🚩Direct Default Group
    type: select
    proxies:
      - DIRECT
      - 🌐Select Group
  - name: 🛡️Proxy Default Group
    type: select
    proxies:
      - 🌐Select Group
      - DIRECT
  - name: ❌Reject Default Group
    type: select
    proxies:
      - REJECT
      - DIRECT
      - 🌐Select Group
  - name: 🛟Other Default
    type: select
    proxies:
      - 🌐Select Group
      - DIRECT
      - ❌Reject Default Group
