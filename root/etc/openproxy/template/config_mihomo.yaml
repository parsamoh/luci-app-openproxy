# port: 7890 # HTTP(S) proxy server port
# socks-port: 7891 # SOCKS5 proxy port
mixed-port: 10801 # HTTP(S) and SOCKS proxy mixed port
# redir-port: 7892 # Transparent proxy port, used for Linux and MacOS

# Transparent proxy server port for Linux (TProxy TCP and TProxy UDP)
# tproxy-port: 7893

allow-lan: true # Allow LAN connection
bind-address: "*" # Bind IP address, only effective when allow-lan is true, '*' means all addresses
authentication: # http,socks authentication username, password
  - "username:password"
skip-auth-prefixes: # Set IP segments to skip authentication
  - 127.0.0.1/8
  - ::1/128
lan-allowed-ips: # Allowed IP address segments, only effective when allow-lan is true, default value is 0.0.0.0/0 and ::/0
  - 0.0.0.0/0
  - ::/0
lan-disallowed-ips: # Forbidden IP address segments, blacklist priority is higher than whitelist, default value is empty
  - 192.168.0.3/32

#  find-process-mode has 3 values:always, strict, off
#  - always, Enable, force match all processes
#  - strict, Default, mihomo judges whether to open
#  - off, Do not match processes, recommended to use this mode on routers
find-process-mode: strict

mode: rule

# Custom geodata url
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"

geo-auto-update: false # Whether to automatically update geodata
geo-update-interval: 24 # Update interval, unit: hours

# Matcher implementation used by GeoSite, available implementations:
# - succinct (default, same as rule-set)
# - mph (from V2Ray, also `hybrid` in Xray)
# geosite-matcher: succinct

log-level: info # Log level silent/error/warning/info/debug

ipv6: true # Enable IPv6 switch, disable will block all IPv6 connections and block DNS request AAAA records

tls:
  certificate: string # Certificate PEM format, or certificate path
  private-key: string # Private key corresponding to certificate PEM format, or private key path
  custom-certifactes:
    - |
      -----BEGIN CERTIFICATE-----
      format/pem...
      -----END CERTIFICATE-----

external-controller: 0.0.0.0:9093 # RESTful API listening address
external-controller-tls: 0.0.0.0:9443 # RESTful API HTTPS listening address, need to configure tls section config file
# secret: "123456" # `Authorization:Bearer ${secret}`

# RESTful API CORS header config
external-controller-cors:
  allow-origins:
    - *
  allow-private-network: true

# RESTful API Unix socket listening address (Windows version greater than 17063 can also be used, i.e., version greater than or equal to 1803/RS4 can be used)
# !!! Note: Accessing api interface from Unix socket will not verify secret, if enabled please ensure security yourself !!!
# Test method: curl -v --unix-socket "mihomo.sock" http://localhost/
external-controller-unix: mihomo.sock

# RESTful API Windows namedpipe listening address
# !!! Note: Accessing api interface from Windows namedpipe will not verify secret, if enabled please ensure security yourself !!!
external-controller-pipe: \\.\pipe\mihomo

# tcp-concurrent: true # TCP concurrent connection to all IPs, will use the fastest handshake TCP

# Configure WEB UI directory, use http://{{external-controller}}/ui to access
external-ui: /path/to/ui/folder/
external-ui-name: xd
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

# Enable DOH server on RESTful API port
# !!! This URL will not verify secret, if enabled please ensure security yourself !!!
external-doh-server: /dns-query

# interface-name: en0 # Set outbound interface

# Global TLS fingerprint, priority lower than client-fingerprint inside proxy
# Optional: "chrome","firefox","safari","ios","random","none" options.
# Utls is currently support TLS transport in TCP/grpc/WS/HTTP for VLESS/Vmess and trojan.
global-client-fingerprint: chrome

#  TCP keep alive interval
# disable-keep-alive: false # Currently forced to true on android
# keep-alive-idle: 15
# keep-alive-interval: 15

# routing-mark:6666 # Configure fwmark only used for Linux
experimental:
  # Disable quic-go GSO support. This may result in reduced performance on Linux.
  # This is not recommended for most users.
  # Only users encountering issues with quic-go's internal implementation should enable this,
  # and they should disable it as soon as the issue is resolved.
  # This field will be removed when quic-go fixes all their issues in GSO.
  # This equivalent to the environment variable QUIC_GO_DISABLE_GSO=1.
  #quic-go-disable-gso: true

# Similar to /etc/hosts, only supports configuring single IP
hosts:
# '*.mihomo.dev': 127.0.0.1
# '.dev': 127.0.0.1
# 'alpha.mihomo.dev': '::1'
# test.com: [1.1.1.1, 2.2.2.2]
# home.lan: lan # lan is a special field, will add addresses of all local network cards
# baidu.com: google.com # Only allow configuring one alias

profile: # Store select selection records
  store-selected: false

  # Persist fake-ip
  store-fake-ip: true

# Tun Config
tun:
  enable: false
  stack: system # gvisor/mixed
  dns-hijack:
  dns-hijack:
    - 0.0.0.0:53 # DNS needed to hijack
  # auto-detect-interface: true # Auto detect outbound interface
  # auto-route: true # Configure routing table
  # mtu: 9000 # Maximum transmission unit
  # gso: false # Enable Generic Segmentation Offload, only supports Linux
  # gso-max-size: 65536 # Maximum size of Generic Segmentation Offload packet
  auto-redirect: false # Automatically configure iptables to redirect TCP connections. Only supports Linux. auto-route with auto-redirect now works as expected on routers without intervention.
  # strict-route: true # Route all connections to tun to prevent leakage, but your device will not be accessible by other devices
  route-address-set: # Add target IP CIDR rules in specified ruleset to firewall, unmatched traffic will bypass routing, only supports Linux, requires nftables, `auto-route` and `auto-redirect` enabled.
    - ruleset-1
    - ruleset-2
  route-exclude-address-set: # Add target IP CIDR rules in specified ruleset to firewall, matched traffic will bypass routing, only supports Linux, requires nftables, `auto-route` and `auto-redirect` enabled.
    - ruleset-3
    - ruleset-4
  route-address: # Use custom routing instead of default routing when auto-route is enabled
    - 0.0.0.0/1
    - 128.0.0.0/1
    - "::/1"
    - "8000::/1"
  # inet4-route-address: # Use custom routing instead of default routing when auto-route is enabled (old syntax)
  #   - 0.0.0.0/1
  #   - 128.0.0.0/1
  # inet6-route-address: # Use custom routing instead of default routing when auto-route is enabled (old syntax)
  #   - "::/1"
  #   - "8000::/1"
  # endpoint-independent-nat: false # Enable endpoint independent NAT
  # include-interface: # Limit routed interfaces. Default no limit, conflicts with `exclude-interface`
  #   - "lan0"
  # exclude-interface: # Exclude routed interfaces, conflicts with `include-interface`
  #   - "lan1"
  # include-uid: # UID rules only supported under Linux, and requires auto-route
  # - 0
  # include-uid-range: # Limit user range to be routed
  # - 1000:9999
  # exclude-uid: # Exclude routed users
  #- 1000
  # exclude-uid-range: # Exclude routed user range
  # - 1000:9999

  # Android user and app rules only supported under Android
  # And requires auto-route

  # include-android-user: # Limit routed Android users
  # - 0
  # - 10
  # include-package: # Limit routed Android app package names
  # - com.android.chrome
  # exclude-package: # Exclude routed Android app package names
  # - com.android.captiveportallogin

# Sniffing domain optional configuration
sniffer:
  enable: false
  ## Force sniffing for traffic identified as redir-host type
  ## e.g. Tun, Redir and TProxy and DNS is redir-host
  # force-dns-mapping: false
  ## Force sniffing for all traffic where domain name is not obtained
  # parse-pure-ip: false
  # Whether to use sniffing results as actual access, default true
  # Global configuration, priority lower than sniffer.sniff actual configuration
  override-destination: false
  sniff: # TLS and QUIC default to sniffing 443 if ports are not configured
    QUIC:
    #  ports: [ 443 ]
    TLS:
    #  ports: [443, 8443]

    # Default sniff 80
    HTTP: # Ports to sniff
      ports: [80, 8080-8880]
      # Can override sniffer.override-destination
      override-destination: true
  force-domain:
    - +.v2ex.com
  # skip-src-address: # Skip sniffing for source IP
  #   - 192.168.0.3/32
  # skip-dst-address: # Skip sniffing for destination IP
  #   - 192.168.0.3/32
  ## Skip sniffing results
  # skip-domain:
  #   - Mijia Cloud
  # Sniffing protocol needed
  # Deprecated, invalid if sniffer.sniff is configured
  sniffing:
    - tls
    - http
  # Force sniffing for this domain

  # Only sniff ports in whitelist, default 443, 80
  # Deprecated, invalid if sniffer.sniff is configured
  port-whitelist:
    - "80"
    - "443"
    # - 8000-9999

tunnels: # one line config
  - tcp/udp,127.0.0.1:6553,114.114.114.114:53,proxy
  - tcp,127.0.0.1:6666,rds.mysql.com:3306,vpn
  # full yaml config
  - network: [tcp, udp]
    address: 127.0.0.1:7777
    target: target.com
    proxy: proxy

# DNS Config
dns:
  cache-algorithm: arc
  enable: false # Disable to use system DNS
  prefer-h3: false # Whether to enable DoH support for HTTP/3, will try concurrently
  listen: 0.0.0.0:53 # Enable DNS server listening
  # ipv6: false # false will return empty AAAA result
  # ipv6-timeout: 300 # Unit: ms, when internal dual stack concurrent, waiting time for AAAA when querying upstream for AAAA, default 100ms
  # DNS service domain used for resolving nameserver, fallback and other DNS server configurations
  # Can only use pure IP address, can use encrypted DNS
  default-nameserver:
    - 114.114.114.114
    - 8.8.8.8
    - tls://1.12.12.12:853
    - tls://223.5.5.5:853
    - system # append DNS server from system configuration. If not found, it would print an error log and skip.
  enhanced-mode: fake-ip # or redir-host

  fake-ip-range: 198.18.0.1/16 # fake-ip pool setting

  # Configure domains not using fake-ip
  fake-ip-filter:
    - '*.lan'
    - localhost.ptlogin2.qq.com
    # fakeip-filter is a rule subscription named fakeip-filter in rule-providers,
    # and behavior must be domain/classical, only domain rules will take effect when classical
    - rule-set:fakeip-filter
    # fakeip-filter is a category named fakeip-filter in geosite (need to ensure this category exists)
    - geosite:fakeip-filter
  # Configure matching mode for fake-ip-filter, default is blacklist, i.e., return fake-ip if match failed
  # Can be set to whitelist, i.e., return fake-ip only if match succeeds
  fake-ip-filter-mode: blacklist

  # use-hosts: true # Query hosts

  # Configure whether the connection process to dns server for nameserver, fallback and nameserver-policy adheres to rules
  # If false (default), these three parts of dns servers will connect directly if not specified
  # If true, will match connection method according to rules (proxy or direct), if specified, strictly follow specified value
  # Can only be enabled when proxy-server-nameserver is not empty, strongly not recommended to use with prefer-h3
  # In addition, if domain name appears in these three configurations of dns servers, it will use default-nameserver configuration item to resolve, please also ensure default-nameserver is configured correctly
  respect-rules: false

  # DNS Main domain configuration
  # Support UDP, TCP, DoT, DoH, DoQ
  # This part is main DNS configuration, affects all direct connections, ensure to use DNS accurate for mainland parsing
  nameserver:
    - 114.114.114.114 # default value
    - 8.8.8.8 # default value
    - tls://223.5.5.5:853 # DNS over TLS
    - https://doh.pub/dns-query # DNS over HTTPS
    - https://dns.alidns.com/dns-query#h3=true # Force HTTP/3, unrelated to prefer-h3, force enable DoH HTTP/3 support, cannot use if not supported
    - https://mozilla.cloudflare-dns.com/dns-query#DNS&h3=true # Specify policy group and use HTTP/3
    - dhcp://en0 # dns from dhcp
    - quic://dns.adguard.com:784 # DNS over QUIC
    # - '8.8.8.8#RULES' # Effect same as respect-rules, but only effective for this server
    # - '8.8.8.8#en0' # Compatible with specifying DNS outbound interface

  # When fallback is configured, will query if IP returned in nameserver is CN, optional configuration
  # When not CN, use DNS query result in fallback
  # Ensure normal query when configuring fallback
  # fallback:
  #   - tcp://1.1.1.1
  #   - 'tcp://1.1.1.1#ProxyGroupName' # Specify DNS proxy query, ProxyGroupName is policy group name or node name, proxy configuration takes precedence over outbound interface, set to outbound interface when policy group or node name not found

  # DNS server dedicated for node domain resolution, optional configuration item, if not filled then follow configuration of nameserver-policy, nameserver and fallback
  # proxy-server-nameserver:
  #   - https://dns.google/dns-query
  #   - tls://one.one.one.one

  # DNS server dedicated for direct outbound domain resolution, optional configuration item, if not filled then follow configuration of nameserver-policy, nameserver and fallback
  # direct-nameserver:
  #   - system://
  # direct-nameserver-follow-policy: false # Whether to follow nameserver-policy, default is not follow, only effective when direct-nameserver is not empty

  # Configure fallback usage conditions
  # fallback-filter:
  #   geoip: true # Configure whether to use geoip
  #   geoip-code: CN # When nameserver domain IP query geoip library is CN, do not use DNS query result in fallback
  #   Configure forced fallback, priority higher than IP judgment, check geosite library for specific categories
  #   geosite:
  #     - gfw
  #   If not match ipcidr then use results in nameservers
  #   ipcidr:
  #     - 240.0.0.0/4
  #   domain:
  #     - '+.google.com'
  #     - '+.facebook.com'
  #     - '+.youtube.com'

  # Configure DNS servers used for querying domains
  nameserver-policy:
    #   'www.baidu.com': '114.114.114.114'
    #   '+.internal.crop.com': '10.0.0.1'
    "geosite:cn,private,apple":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:category-ads-all": rcode://success
    "www.baidu.com,+.google.cn": [223.5.5.5, https://dns.alidns.com/dns-query]
    ## global, dns are rule subscriptions named global and dns in rule-providers,
    ## and behavior must be domain/classical, only domain rules will take effect when classical
    # "rule-set:global,dns": 8.8.8.8

proxies: # socks5
  - name: "socks"
    type: socks5
    server: server
    port: 443
    # username: username
    # password: password
    # tls: true
    # fingerprint: xxxx
    # skip-cert-verify: true
    # udp: true
    # ip-version: ipv6

  # http
  - name: "http"
    type: http
    server: server
    port: 443
    # username: username
    # password: password
    # tls: true # https
    # skip-cert-verify: true
    # sni: custom.com
    # fingerprint: xxxx # Same as experimental.fingerprints Use sha256 fingerprint, configure protocol independent fingerprint, will ignore experimental.fingerprints
    # ip-version: dual

  # Snell
  # Beware that there's currently no UDP support yet
  - name: "snell"
    type: snell
    server: server
    port: 44046
    psk: yourpsk
    # version: 2
    # obfs-opts:
    # mode: http # or tls
    # host: bing.com

  # Shadowsocks
  # cipher support:
  #   aes-128-gcm aes-192-gcm aes-256-gcm
  #   aes-128-cfb aes-192-cfb aes-256-cfb
  #   aes-128-ctr aes-192-ctr aes-256-ctr
  #   rc4-md5 chacha20-ietf xchacha20
  #   chacha20-ietf-poly1305 xchacha20-ietf-poly1305
  #   2022-blake3-aes-128-gcm 2022-blake3-aes-256-gcm 2022-blake3-chacha20-poly1305
  - name: "ss1"
    type: ss
    server: server
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "password"
    # udp: true
    # udp-over-tcp: false
    # ip-version: ipv4 # Set node to use IP version, optional: dual, ipv4, ipv6, ipv4-prefer, ipv6-prefer. Default use dual
    # ipv4: Only use IPv4  ipv6: Only use IPv6
    # ipv4-prefer: Prefer IPv4, for TCP will perform dual stack resolution, concurrent connection but prefer IPv4 connection,
    # UDP is dual stack resolution, get first IPv4 in results
    # ipv6-prefer Same as ipv4-prefer
    # Existing protocols all support this parameter, TCP effect only effective when tcp-concurrent is enabled
    smux:
      enabled: false
      protocol: smux # smux/yamux/h2mux
      # max-connections: 4 # Maximum connections. Conflict with max-streams.
      # min-streams: 4 # Minimum multiplexed streams in a connection before opening a new connection. Conflict with max-streams.
      # max-streams: 0 # Maximum multiplexed streams in a connection before opening a new connection. Conflict with max-connections and min-streams.
      # padding: false # Enable padding. Requires sing-box server version 1.3-beta9 or later.
      # statistic: false # Control whether to show underlying connection in dashboard, convenient to interrupt underlying connection
      # only-tcp: false # If set to true, smux settings will not be effective for udp, udp connection will go directly through underlying protocol

  - name: "ss2"
    type: ss
    server: server
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "password"
    plugin: obfs
    plugin-opts:
      mode: tls # or http
      # host: bing.com

  - name: "ss3"
    type: ss
    server: server
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "password"
    plugin: v2ray-plugin
    plugin-opts:
      mode: websocket # no QUIC now
      # tls: true # wss
      # You can use openssl x509 -noout -fingerprint -sha256 -inform pem -in yourcert.pem to get
      # Configure fingerprint will achieve SSL Pining effect
      # fingerprint: xxxx
      # skip-cert-verify: true
      # host: bing.com
      # path: "/"
      # mux: true
      # headers:
      #   custom: value
      # v2ray-http-upgrade: false
      # v2ray-http-upgrade-fast-open: false

  - name: "ss4-shadow-tls"
    type: ss
    server: server
    port: 443
    cipher: chacha20-ietf-poly1305
    password: "password"
    plugin: shadow-tls
    client-fingerprint: chrome
    plugin-opts:
      host: "cloud.tencent.com"
      password: "shadow_tls_password"
      version: 2 # support 1/2/3

  - name: "ss-restls-tls13"
    type: ss
    server: [YOUR_SERVER_IP]
    port: 443
    cipher: chacha20-ietf-poly1305
    password: [YOUR_SS_PASSWORD]
    client-fingerprint:
      chrome # One of: chrome, ios, firefox or safari
      # Can be one of chrome, ios, firefox, safari
    plugin: restls
    plugin-opts:
      host:
        "www.microsoft.com" # Must be a TLS 1.3 server
        # Should be a TLS 1.3 server
      password: [YOUR_RESTLS_PASSWORD]
      version-hint: "tls13"
      # Control your post-handshake traffic through restls-script
      # Hide proxy behaviors like "tls in tls".
      # see https://github.com/3andne/restls/blob/main/Restls-Script:%20Hide%20Your%20Proxy%20Traffic%20Behavior.md
      # Use restls script to control behavior after handshake, hide characteristics like "tls in tls"
      # Details: https://github.com/3andne/restls/blob/main/Restls-Script:%20%E9%9A%90%E8%97%8F%E4%BD%A0%E7%9A%84%E4%BB%A3%E7%90%86%E8%A1%8C%E4%B8%BA.md
      restls-script: "300?100<1,400~100,350~100,600~100,300~200,300~100"

  - name: "ss-restls-tls12"
    type: ss
    server: [YOUR_SERVER_IP]
    port: 443
    cipher: chacha20-ietf-poly1305
    password: [YOUR_SS_PASSWORD]
    client-fingerprint:
      chrome # One of: chrome, ios, firefox or safari
      # Can be one of chrome, ios, firefox, safari
    plugin: restls
    plugin-opts:
      host:
        "vscode.dev" # Must be a TLS 1.2 server
        # Should be a TLS 1.2 server
      password: [YOUR_RESTLS_PASSWORD]
      version-hint: "tls12"
      restls-script: "1000?100<1,500~100,350~100,600~100,400~200"

  # vmess
  # cipher supports auto/aes-128-gcm/chacha20-poly1305/none
  - name: "vmess"
    type: vmess
    server: server
    port: 443
    uuid: uuid
    alterId: 32
    cipher: auto
    # udp: true
    # tls: true
    # fingerprint: xxxx
    # client-fingerprint: chrome    # Available: "chrome","firefox","safari","ios","random", currently only support TLS transport in TCP/GRPC/WS/HTTP for VLESS/Vmess and trojan.
    # skip-cert-verify: true
    # servername: example.com # priority over wss host
    # network: ws
    # ws-opts:
      # path: /path
      # headers:
      #   Host: v2ray.com
      # max-early-data: 2048
      # early-data-header-name: Sec-WebSocket-Protocol
      # v2ray-http-upgrade: false
      # v2ray-http-upgrade-fast-open: false

  - name: "vmess-h2"
    type: vmess
    server: server
    port: 443
    uuid: uuid
    alterId: 32
    cipher: auto
    network: h2
    tls: true
    # fingerprint: xxxx
    h2-opts:
      host:
        - http.example.com
        - http-alt.example.com
      path: /

  - name: "vmess-http"
    type: vmess
    server: server
    port: 443
    uuid: uuid
    alterId: 32
    cipher: auto
    # udp: true
    # network: http
    # http-opts:
    #   method: "GET"
    #   path:
    #     - '/'
    #     - '/video'
    #   headers:
    #     Connection:
    #       - keep-alive
    # ip-version: ipv4 # Set IP type preference, optional: ipv4, ipv6, dual, default user: dual

  - name: vmess-grpc
    server: server
    port: 443
    type: vmess
    uuid: uuid
    alterId: 32
    cipher: auto
    network: grpc
    tls: true
    # fingerprint: xxxx
    servername: example.com
    # skip-cert-verify: true
    grpc-opts:
      grpc-service-name: "example"
    # ip-version: ipv4

  # vless
  - name: "vless-tcp"
    type: vless
    server: server
    port: 443
    uuid: uuid
    network: tcp
    servername: example.com # AKA SNI
    # flow: xtls-rprx-direct # xtls-rprx-origin  # enable XTLS
    # skip-cert-verify: true
    # fingerprint: xxxx
    # client-fingerprint: random # Available: "chrome","firefox","safari","random","none"

  - name: "vless-vision"
    type: vless
    server: server
    port: 443
    uuid: uuid
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    client-fingerprint: chrome
    # fingerprint: xxxx
    # skip-cert-verify: true

  - name: "vless-reality-vision"
    type: vless
    server: server
    port: 443
    uuid: uuid
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.microsoft.com # REALITY servername
    reality-opts:
      public-key: xxx
      short-id: xxx # optional
    client-fingerprint: chrome # cannot be empty

  - name: "vless-reality-grpc"
    type: vless
    server: server
    port: 443
    uuid: uuid
    network: grpc
    tls: true
    udp: true
    flow:
    # skip-cert-verify: true
    client-fingerprint: chrome
    servername: testingcf.jsdelivr.net
    grpc-opts:
      grpc-service-name: "grpc"
    reality-opts:
      public-key: CrrQSjAG_YkHLwvM2M-7XkKJilgL5upBKCp0od0tLhE
      short-id: 10f897e26c4b9478

  - name: "vless-ws"
    type: vless
    server: server
    port: 443
    uuid: uuid
    udp: true
    tls: true
    network: ws
    # client-fingerprint: random # Available: "chrome","firefox","safari","random","none"
    servername: example.com # priority over wss host
    # skip-cert-verify: true
    # fingerprint: xxxx
    ws-opts:
      path: "/"
      headers:
        Host: example.com
      # v2ray-http-upgrade: false
      # v2ray-http-upgrade-fast-open: false

  # Trojan
  - name: "trojan"
    type: trojan
    server: server
    port: 443
    password: yourpsk
