    type: mieru
    server: 1.2.3.4
    port: 2999
    # port-range: 2090-2099 #(Cannot fill in port and port-range at the same time)
    transport: TCP # Only supports TCP
    username: user
    password: password

# dns outbound will hijack requests to internal dns module, all requests are processed internally
  - name: "dns-out"
    type: dns
proxy-groups:
  # Proxy chain, currently relay only supports udp for vmess/vless/trojan/ss/ssr/tuic
  # wireguard currently does not support use in relay, please use dialer-proxy configuration item in proxy
  # Traffic: mihomo <-> http <-> vmess <-> ss1 <-> ss2 <-> Internet
  - name: "relay"
    type: relay
    proxies:
      - http
      - vmess
      - ss1
      - ss2

  # url-test will use the node with lowest latency according to url test results
  - name: "auto"
    type: url-test
    proxies:
      - ss1
      - ss2
      - vmess1
    # tolerance: 150
    # lazy: true
    # expected-status: 204 # 当健康检查返回状态码与期望值不符时，认为节点不可用
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300

  # fallback will choose in node order according to url test results
  - name: "fallback-auto"
    type: fallback
    proxies:
      - ss1
      - ss2
      - vmess1
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300

  # load-balance will randomly select nodes according to algorithm
  - name: "load-balance"
    type: load-balance
    proxies:
      - ss1
      - ss2
      - vmess1
    url: "https://cp.cloudflare.com/generate_204"
    interval: 300
  # strategy: consistent-hashing # Optional round-robin and sticky-sessions

  # select User selects node manually
  - name: Proxy
    type: select
    # disable-udp: true
    proxies:
      - ss1
      - ss2
      - vmess1
      - auto

  # Configure DIRECT specifying interface-name and fwmark
  - name: en1
    type: select
    interface-name: en1
    routing-mark: 6667
    proxies:
      - DIRECT

  - name: UseProvider
    type: select
    filter: "HK|TW" # Regular expression, filter nodes in provider1 containing HK or TW in name
    use:
      - provider1
    proxies:
      - Proxy
      - DIRECT

# Mihomo format node or share format supporting *ray
proxy-providers:
  provider1:
    type: http # http path can be empty, default storage path is proxies folder in homedir, filename is md5 of url
    url: "url"
    interval: 3600
    path: ./provider1.yaml # Default only allowed to store in mihomo Home Dir, if want to store anywhere, add environment variable SKIP_SAFE_PATH_CHECK=1
    proxy: DIRECT
    # size-limit: 10240 # 限制下载文件最大为10kb，默认为0即不限制文件大小
    header:
      User-Agent:
      - "Clash/v1.18.0"
      - "mihomo/1.18.3"
      # Accept:
      # - 'application/vnd.github.v3.raw'
      # Authorization:
      # - 'token 1231231'
    health-check:
      enable: true
      interval: 600
      # lazy: true
      url: https://cp.cloudflare.com/generate_204
      # expected-status: 204 # When health check return status code does not match expected value, the node is considered unavailable
    override: # Override some configuration items when loading nodes
      skip-cert-verify: true
      udp: true
      # down: "50 Mbps"
      # up: "10 Mbps"
      # dialer-proxy: proxy
      # interface-name: tailscale0
      # routing-mark: 233
      # ip-version: ipv4-prefer
      # additional-prefix: "[provider1]"
      # additional-suffix: "test"
      # # Name replacement, supports regular expressions
      # proxy-name:
      #   - pattern: "test"
      #     target: "TEST"
      #   - pattern: "IPLC-(.*?)倍"
      #     target: "iplc x $1"

  test:
    type: file
    path: /test.yaml
    health-check:
      enable: true
      interval: 36000
      url: https://cp.cloudflare.com/generate_204
rule-providers:
  rule1:
    behavior: classical # domain ipcidr
    interval: 259200
    path: /path/to/save/file.yaml # Default only allowed to store in mihomo Home Dir, if want to store anywhere, add environment variable SKIP_SAFE_PATH_CHECK=1
    type: http # http path can be empty, default storage path is rules folder in homedir, filename is md5 of url
    url: "url"
    proxy: DIRECT
    # size-limit: 10240 # 限制下载文件最大为10kb，默认为0即不限制文件大小
  rule2:
    behavior: classical
    interval: 259200
    path: /path/to/save/file.yaml
    type: file
  rule3:
    # mrs type ruleset, currently only supports domain and ipcidr (i.e. does not support classical),
    #
    # For behavior=domain:
    #  - format=yaml can convert to mrs format via "mihomo convert-ruleset domain yaml XXX.yaml XXX.mrs"
    #  - format=text can convert to mrs format via "mihomo convert-ruleset domain text XXX.text XXX.mrs"
    #  - XXX.mrs can convert back to text format via "mihomo convert-ruleset domain mrs XXX.mrs XXX.text" (converting back to yaml format not supported yet)
    #
    # For behavior=ipcidr:
    #  - format=yaml can convert to mrs format via "mihomo convert-ruleset ipcidr yaml XXX.yaml XXX.mrs"
    #  - format=text can convert to mrs format via "mihomo convert-ruleset ipcidr text XXX.text XXX.mrs"
    #  - XXX.mrs can convert back to text format via "mihomo convert-ruleset ipcidr mrs XXX.mrs XXX.text" (converting back to yaml format not supported yet)
    #
    type: http
    url: "url"
    format: mrs
    behavior: domain
    path: /path/to/save/file.mrs
rules:
  - RULE-SET,rule1,REJECT
  - IP-ASN,1,PROXY
  - DOMAIN-REGEX,^abc,DIRECT
  - DOMAIN-SUFFIX,baidu.com,DIRECT
  - DOMAIN-KEYWORD,google,ss1
  - IP-CIDR,1.1.1.1/32,ss1
  - IP-CIDR6,2409::/64,DIRECT
  # When condition matches TCP or UDP traffic, use ruleset named sub-rule-name1
  - SUB-RULE,(OR,((NETWORK,TCP),(NETWORK,UDP))),sub-rule-name1
  - SUB-RULE,(AND,((NETWORK,UDP))),sub-rule-name2
# Define multiple sub-rulesets, rules will match in forks, used by SUB-RULE
#                                               google.com(not match)--> baidu.com(match)
#                                                /                                ｜
#                                               /                                 ｜
#  https://baidu.com  --> rule1 --> rule2 --> sub-rule-name1(match tcp)          Use DIRECT
#
#
#                                              google.com(not match)--> baidu.com(not match)
#                                                /                            ｜
#                                               /                             ｜
#  dns 1.1.1.1  --> rule1 --> rule2 --> sub-rule-name1(match udp)         sub-rule-name2(match udp)
#                                                                             ｜
#                                                                             ｜
#                                                                 Use REJECT <-- 1.1.1.1/32(match)
#

sub-rules:
  sub-rule-name1:
    - DOMAIN,google.com,ss1
    - DOMAIN,baidu.com,DIRECT
  sub-rule-name2:
    - IP-CIDR,1.1.1.1/32,REJECT
    - IP-CIDR,8.8.8.8/32,ss1
    - DOMAIN,dns.alidns.com,REJECT

# Traffic Inbound
listeners:
  - name: socks5-in-1
    type: socks
    port: 10808
    #listen: 0.0.0.0 # Default listen 0.0.0.0
    # rule: sub-rule-name1 # Default use rules, if sub-rule not found then directly use rules
    # proxy: proxy # If not empty then directly hand over inbound traffic to specified proxy for processing
    # udp: false # Default true
    # users: # If users item not filled, follow global authentication setting, if filled ignore global setting, if want to skip verification for this inbound can fill users: []
    #   - username: aaa
    #     password: aaa

  - name: http-in-1
    type: http
    port: 10809
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Default use rules, if sub-rule not found then directly use rules
    # proxy: proxy # If not empty then directly hand over inbound traffic to specified proxy for processing (when proxy is not empty, proxy name here must be valid, otherwise error occurs)
    # users: # If users item not filled, follow global authentication setting, if filled ignore global setting, if want to skip verification for this inbound can fill users: []
    #   - username: aaa
    #     password: aaa

  - name: mixed-in-1
    type: mixed #  HTTP(S) and SOCKS proxy mixed
    port: 10810
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Default use rules, if sub-rule not found then directly use rules
    # proxy: proxy # If not empty then directly hand over inbound traffic to specified proxy for processing (when proxy is not empty, proxy name here must be valid, otherwise error occurs)
    # udp: false # Default true
    # users: # If users item not filled, follow global authentication setting, if filled ignore global setting, if want to skip verification for this inbound can fill users: []
    #   - username: aaa
    #     password: aaa

  - name: reidr-in-1
    type: redir
    port: 10811
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Default use rules, if sub-rule not found then directly use rules
    # proxy: proxy # If not empty then directly hand over inbound traffic to specified proxy for processing (when proxy is not empty, proxy name here must be valid, otherwise error occurs)

  - name: tproxy-in-1
    type: tproxy
    port: 10812
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Default use rules, if sub-rule not found then directly use rules
    # proxy: proxy # If not empty then directly hand over inbound traffic to specified proxy for processing (when proxy is not empty, proxy name here must be valid, otherwise error occurs)
    # udp: false # Default true

  - name: shadowsocks-in-1
    type: shadowsocks
    port: 10813
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Default use rules, if sub-rule not found then directly use rules
    # proxy: proxy # If not empty then directly hand over inbound traffic to specified proxy for processing (when proxy is not empty, proxy name here must be valid, otherwise error occurs)
    password: vlmpIPSyHH6f4S8WVPdRIHIlzmB+GIRfoH3aNJ/t9Gg=
    cipher: 2022-blake3-aes-256-gcm

  - name: vmess-in-1
    type: vmess
    port: 10814
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Default use rules, if sub-rule not found then directly use rules
    # proxy: proxy # If not empty then directly hand over inbound traffic to specified proxy for processing (when proxy is not empty, proxy name here must be valid, otherwise error occurs)
    users:
      - username: 1
        uuid: 9d0cb9d0-964f-4ef6-897d-6c6b3ccf9e68
        alterId: 1
    # ws-path: "/" # If not empty then enable websocket transport layer
    # If following two items are filled then enable tls (need to fill both)
    # certificate: ./server.crt
    # private-key: ./server.key

  - name: tuic-in-1
    type: tuic
    port: 10815
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Default use rules, if sub-rule not found then directly use rules
    # proxy: proxy # If not empty then directly hand over inbound traffic to specified proxy for processing (when proxy is not empty, proxy name here must be valid, otherwise error occurs)
    # token:    # tuicV4 fill (can fill users at the same time)
    #   - TOKEN
    # users:    # tuicV5 fill (can fill token at the same time)
    #   00000000-0000-0000-0000-000000000000: PASSWORD_0
    #   00000000-0000-0000-0000-000000000001: PASSWORD_1
    #  certificate: ./server.crt
    #  private-key: ./server.key
    #  congestion-controller: bbr
    #  max-idle-time: 15000
    #  authentication-timeout: 1000
    #  alpn:
    #    - h3
    #  max-udp-relay-packet-size: 1500

  - name: tunnel-in-1
    type: tunnel
    port: 10816
    listen: 0.0.0.0
    # rule: sub-rule-name1 # Default use rules, if sub-rule not found then directly use rules
    # proxy: proxy # If not empty then directly hand over inbound traffic to specified proxy for processing (when proxy is not empty, proxy name here must be valid, otherwise error occurs)
    network: [tcp, udp]
    target: target.com

  - name: tun-in-1
    type: tun
    # rule: sub-rule-name1 # Default use rules, if sub-rule not found then directly use rules
    # proxy: proxy # If not empty then directly hand over inbound traffic to specified proxy for processing (when proxy is not empty, proxy name here must be valid, otherwise error occurs)
    stack: system # gvisor / mixed
    dns-hijack:
    - 0.0.0.0:53 # DNS needed to hijack
    # auto-detect-interface: false # Auto detect outbound interface
    # auto-route: false # Configure routing table
    # mtu: 9000 # Maximum transmission unit
    inet4-address: # Must manually set ipv4 address segment
    - 198.19.0.1/30
    inet6-address: # Must manually set ipv6 address segment
    - "fdfe:dcba:9877::1/126"
    # strict-route: true # Route all connections to tun to prevent leakage, but your device will not be accessible by other devices
    # inet4-route-address: # Use custom routing instead of default routing when auto-route is enabled
    # - 0.0.0.0/1
    # - 128.0.0.0/1
    # inet6-route-address: # Use custom routing instead of default routing when auto-route is enabled
    # - "::/1"
    # - "8000::/1"
    # endpoint-independent-nat: false # Enable endpoint independent NAT
    # include-uid: # UID rules only supported under Linux, and requires auto-route
    # - 0
    # include-uid-range: # Limit user range to be routed
    # - 1000:99999
    # exclude-uid: # Exclude routed users
    # - 1000
    # exclude-uid-range: # Exclude routed user range
    # - 1000:99999

    # Android user and app rules only supported under Android
    # And requires auto-route

    # include-android-user: # Limit routed Android users
    # - 0
    # - 10
    # include-package: # Limit routed Android app package names
    # - com.android.chrome
    # exclude-package: # Exclude routed Android app package names
    # - com.android.captiveportallogin
