<%+header%>
    <style>
        .update-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #f9f9f9;
        }

        .region-row {
            display: flex;
            align-items: center;
            margin: 10px 0;
            gap: 10px;
        }

        .region-label {
            min-width: 80px;
            font-weight: bold;
        }

        .url-input {
            flex: 1;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .update-btn {
            padding: 6px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #45a049;
        }

        .update-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 10px;
            padding: 10px;
            border-radius: 3px;
            display: none;
        }

        .status-msg.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-msg.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>

    <h2>
        <%:Regional IP Set Management%>
    </h2>

    <div class="update-section">
        <h3>
            <%:Update IP Sets from URL%>
        </h3>
        <p>
            <%:Download and update regional IP address lists from URLs. Supports plain text format with one CIDR per
                line.%>
        </p>

        <div class="region-row">
            <span class="region-label">🇮🇷 Iran:</span>
            <input type="text" id="iran_url" class="url-input"
                value="https://github.com/Chocolate4U/Iran-clash-rules/releases/latest/download/ircidr.txt"
                placeholder="Enter URL for Iranian IP list">
            <button class="update-btn" onclick="updateIPSet('iran')">
                <%:Update%>
            </button>
        </div>

        <div class="region-row">
            <span class="region-label">🇷🇺 Russia:</span>
            <input type="text" id="russia_url" class="url-input" placeholder="Enter URL for Russian IP list">
            <button class="update-btn" onclick="updateIPSet('russia')">
                <%:Update%>
            </button>
        </div>

        <div class="region-row">
            <span class="region-label">🇨🇳 China:</span>
            <input type="text" id="china_url" class="url-input" placeholder="Enter URL for Chinese IP list">
            <button class="update-btn" onclick="updateIPSet('china')">
                <%:Update%>
            </button>
        </div>

        <div id="status_message" class="status-msg"></div>
    </div>

    <script>
        function showStatus(message, isSuccess) {
            const statusDiv = document.getElementById('status_message');
            statusDiv.textContent = message;
            statusDiv.className = 'status-msg ' + (isSuccess ? 'success' : 'error');
            statusDiv.style.display = 'block';

            // Hide after 5 seconds
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }

        function updateIPSet(region) {
            const urlInput = document.getElementById(region + '_url');
            const url = urlInput.value.trim();

            if (!url) {
                showStatus('Please enter a URL for the ' + region + ' IP list', false);
                return;
            }

            // Disable button during update
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Updating...';

            showStatus('Downloading and processing ' + region + ' IP list...', true);

            fetch('<%=luci.dispatcher.build_url("admin", "services", "openproxy", "api", "update_ipset")%>', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    'url': url,
                    'region': region
                })
            })
                .then(response => response.json())
                .then(data => {
                    btn.disabled = false;
                    btn.textContent = 'Update';

                    if (data.status === 1000) {
                        showStatus(
                            'Successfully updated ' + region + ' IP set! ' +
                            'IPv4: ' + data.ipv4_count + ', IPv6: ' + data.ipv6_count + ' addresses. ' +
                            'Restart service to apply changes.',
                            true
                        );
                    } else {
                        showStatus('Error: ' + (data.message || 'Unknown error occurred'), false);
                    }
                })
                .catch(error => {
                    btn.disabled = false;
                    btn.textContent = 'Update';
                    showStatus('Network error: ' + error.message, false);
                });
        }
    </script>

    <%+footer%>
